<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Product</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <link rel="stylesheet" href="./src/app.css" />
  <link rel="stylesheet" href="./src/index.css" />
  <link rel="stylesheet" href="./src/components/product/product.css" />
  <script type="module" src="./src/components/product/product.js"></script>
  <script type="module" src="./src/app.js"></script>

</head>
<body>
    <header class="header">
    <div class="header__container">
      <div class="header__logo-container">
        <img class="header__logo" src="src/assets/logo.svg">
      </div>
      <div class="user-icons-container">
        <div class="top-bar__icons">
          <span id = "greetings" style="color: white; font-size: medium;">Hello, Algolian </span>
          <img class="top-bar-image" src="src/assets/user.svg">
          <div>
            <img class="top-bar-image" src="src/assets/cart.svg">
            <span class="cart__count" id="cart-count-main">0</span>
          </div>
        </div>
      </div>
    </div>
  </header>
    <div id="navigation">
    <div class="return">
      <a href="index.html" style="color: white;">← Back to search</a>
    </div>
  </div>
  <div class="product__page">
    <div class="product">
      <div class="product__image" id="product-image"></div>
    </div>
    <div class="product__details">
      <h3 class="product__name" id="product-name"></h3>
      <p class="product__description" id="product-description"></p>
      <p class="product__price" id="product-price"></p>
      <div class="product__rating" id="product-rating"></div>
      <div class="product_quantity">
        <label ><b>Quantity</b></label> 
        <input type="number" id="qte_product" name="quantity_article" min="1" style="height: 30px; text-align: center; " value ="1";>
      </div> 
      <button id="add-to-cart" class="result-hit__cart">Add To Cart</button>

    </div>

  </div>
    <script>
    if (!localStorage.getItem('numProductInCart')){
      localStorage.setItem('numProductInCart', 0)
    }
    else{
      document.getElementById('cart-count-main').innerHTML = Number(localStorage.getItem('numProductInCart'));
    }
  </script>
</body>
</html>
