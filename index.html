<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
  <meta name="theme-color" content="#000000">

  <link rel="shortcut icon" href="./favicon.png">

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/instantsearch.css@7/themes/algolia-min.css">
  <link rel="stylesheet" href="./src/index.css">
  <link rel="stylesheet" href="./src/app.css">
  <script src="./src/app.js" type="module"></script>

  <title>algolia-sa-assignment</title>
</head>

<body>
  <header class="header">
    <div class="header__container">
      <div class="header__logo-container">
        <img class="header__logo" src="src/assets/logo.svg">
      </div>
      <div class="header__searchbox-container">
        <div class="header__searchbox" id="searchbox"></div>
        <div class="autocomplete">
          <div class="autocomplete_container">
            <div class="autocomplete__hits" id="autocomplete-hits">
            </div>
          </div>
        </div>
      </div>
      <div class="user-icons-container">
        <div class="top-bar__icons">
          <span id = "greetings" style="color: white; font-size: medium;">Hello, Algolian </span>
          <img class="top-bar-image" src="src/assets/user.svg">
          <div>
            <img class="top-bar-image" src="src/assets/cart.svg">
            <span class="cart__count" id="cart-count-main">0</span>
          </div>
        </div>
      </div>
    </div>
  </header>
  <div id="navigation">
    <span>Home > Search</span>
  </div>
  <div class="results">
    <div class="results__container">
      <div class="facet-panel">
        <div id="clear-refinements"></div>
        <div class="facet-panel__container">
          <h2>Brand</h2>
          <div class="facet-panel__facet-list" id="brand-facet"></div>
        </div>
        <div class="facet-panel__container">
          <h2>Categories</h2>
          <div class="facet-panel__facet-list" id="categories-facet"></div>
        </div>
        <div class="facet-panel__container">
          <h2>Price Range ($)</h2>
          <div class="facet-panel__facet-list" id="pricerange-facet"></div>
        </div>
        <div class="facet-panel__container">
          <h2>Rating Menu</h2>
          <div id="rating-menu"></div>
        </div>
      </div>
      <div class="search-panel">
        <div class="search-panel__results">
          <div id="hits"></div>
        </div>
        <div id="pagination"></div>
      </div>
    </div>
  </div>
  <script>
    if (!localStorage.getItem('numProductInCart')){
      localStorage.setItem('numProductInCart', 0)
    }
    else{
      document.getElementById('cart-count-main').innerHTML = Number(localStorage.getItem('numProductInCart'));
    }
  </script>
</body>

</html>
